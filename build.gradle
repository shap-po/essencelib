plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

def ENV = System.getenv()

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {

        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }

    }
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release"
    }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'Ladysnake Mods (snapshots)'
        url = 'https://maven.ladysnake.org/snapshots'
    }
    maven {
        url = 'https://maven.cafeteria.dev'
        content {
            includeGroup 'net.adriantodt.fabricmc'
        }
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        url "https://masa.dy.fi/maven"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://mvn.devos.one/releases/"
    }
    maven {
        url "https://mvn.devos.one/snapshots/"
    }
    maven {
        url "https://jitpack.io"
    }
    maven {
        url "https://maven.shedaniel.me/"
    }
    maven {
        url "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://maven.nucleoid.xyz/"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}


loom {
    splitEnvironmentSourceSets()

    mods {
        "essencelib" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet sourceSets.test
        }
    }
    runs {
        client {
            client()
            source(sourceSets.test)
            setConfigName("Minecraft Client")
        }
        server {
            server()
            source(sourceSets.test)
            setConfigName("Minecraft Server")
        }
    }
}

fabricApi {
    configureDataGeneration()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Loot Beams Up (Client-side, Optional dependencies below)
    modImplementation "maven.modrinth:loot-beams-up:3.6.1-mc1.21-.1"
    modImplementation "maven.modrinth:modmenu:11.0.1"

    // Legendary Tooltips: REMOVED - Shift-scroll conflicts with crouch and hides essence tooltips.
    // Add legendary-tooltips, iceberg, prism-lib to run/mods/ manually if desired.

    // Pufferfish's Attributes: add puffish_attributes-0.8.2-1.21-fabric.jar to run/mods/ manually

    // Requirements
    modImplementation "io.github.apace100:apoli:${project.apoli_version}"
    modImplementation "maven.modrinth:origins:1.13.0-alpha.12+mc.1.21.1"  // action_on_item_pickup for Collector's Rush
    modImplementation "dev.emi:trinkets:${project.trinkets_version}"
    modImplementation "com.github.shap-po:shappoli:${project.shappoli_version}" // TODO: switch from jitpack to modrinth
    modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1:1.5.3"
    modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:1.5.7"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    modImplementation "maven.modrinth:smartbrainlib:${project.smartbrainlib_version}"
    compileOnly "com.demonwav.mcdev:annotations:2.1.0"
    clientCompileOnly "com.demonwav.mcdev:annotations:2.1.0"
    annotationProcessor "com.demonwav.mcdev:annotations:2.1.0"
    clientAnnotationProcessor "com.demonwav.mcdev:annotations:2.1.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"

    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(Jar).configureEach {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// modrinth configuration
modrinth {
    token = ENV.MODRINTH_TOKEN
    projectId = project.archives_base_name
    uploadFile = remapJar
    dependencies {
        // The scope can be `required`, `optional`, `incompatible`, or `embedded`
        // The type can either be `project` or `version`
        required.project "fabric-api"
        required.project "origins"
        required.project "trinkets"
        required.project "geckolib"
        required.project "smartbrainlib"
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
        mavenLocal()
    }
}
